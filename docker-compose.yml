
services:
  mongodb:
    image: mongo:7
    container_name: wanderlust-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderlust-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/wanderlust
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_PATH: /api
    container_name: wanderlust-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wanderlust-network

volumes:
  mongo_data:

networks:
  wanderlust-network:
    driver: bridge

